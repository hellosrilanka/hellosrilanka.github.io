<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Meet Hello Sri Lanka: private tours and local travel planning.">
<title>About Us | Hello Sri Lanka</title>
<link rel="icon" href="assets/hello-srilanka-logo.jpg">
<link rel="stylesheet" href="css/style.css">
<style>
/* Mobile Responsive Fixes */
:root{--forest:#123d32;--green:#1c6b50;--lime:#d9efb5;--sand:#f7f5ef;--ink:#1d2924;--muted:#66736c;--white:#fff;--line:#e5e9e3;--shadow:0 16px 44px rgba(19,55,42,.10)}
html,body{overflow-x:hidden}
.pagehero{background-color:#092a20;padding:100px 0;color:white;text-align:center;background-image:linear-gradient(100deg,rgba(9,42,32,.9),rgba(9,42,32,.7)),url('sigiriya.jpg');background-size:cover;background-position:center}.pagehero h1{font-size:clamp(2.6rem,5vw,4rem);margin:15px 0}.pagehero p{font-size:1.1rem;max-width:600px;margin:0 auto;color:#eef5ef}.eyebrow{font-size:.78rem;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:var(--lime);margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.split-image{border-radius:24px;height:500px;width:100%;object-fit:cover;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.pricebox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:35px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.banner{background:var(--forest);border-radius:24px;padding:50px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}.banner h2{color:#fff;margin:0 0 10px}.banner p{margin:0;color:#d6e7db;font-size:1.1rem;max-width:500px}

@media(max-width:980px){
  .split{grid-template-columns:1fr}
  .grid3,.footer-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:760px){
  .wrap{width:min(100% - 30px,1160px)}
  .nav-inner,.nav{min-height:68px}
  .hamb,.menu-btn{display:block}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:20px;flex-direction:column;border-bottom:1px solid var(--line);box-shadow:var(--shadow);align-items:stretch}
  .nav-links.show{display:flex}
  .nav-links a{padding:12px 0;font-size:1rem;border-bottom:1px solid var(--line)}
  .nav-links a:last-child{border-bottom:none}
  .nav-cta{display:none}
  
  .brand img{width:45px; height:45px;}
  .brand{font-size:1rem;}
  
  .pagehero{padding:60px 0;}
  .pagehero h1{font-size:2.2rem;}
  .section{padding:55px 0}
  
  .split-image{height:auto; min-height:250px;}
  .grid3,.footer-grid{grid-template-columns:1fr}
  .pricebox{padding:25px;}
  
  .banner{padding:35px 25px;flex-direction:column;text-align:center;gap:20px;}
  .banner .btn{width:100%}
  .footer-inner{flex-direction:column; text-align:center;}
}
</style>
<script src="js/main.js" defer></script>
</head>
<body>
<header class="nav">
<div class="wrap nav-inner">
