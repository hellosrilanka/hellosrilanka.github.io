<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Explore customizable Sri Lanka tour itineraries.">
<title>Tour Packages | Hello Sri Lanka</title>
<link rel="icon" href="logo.jpeg">
<style>
:root{--forest:#123d32;--green:#1c6b50;--lime:#d9efb5;--sand:#f7f5ef;--ink:#1d2924;--muted:#66736c;--white:#fff;--line:#e5e9e3;--shadow:0 16px 44px rgba(19,55,42,.10)}
*{box-sizing:border-box}html,body{overflow-x:hidden}html{scroll-behavior:smooth;scroll-padding-top:84px}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;line-height:1.6}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}
.topbar{background:var(--forest);color:#eaf4e8;font-size:.86rem;text-align:center;padding:8px 12px}.header,.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(20,60,45,.09)}.nav-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.nav .brand img,.footer .brand img{width:58px;height:58px;object-fit:contain}.brand{display:flex;align-items:center;gap:12px;color:var(--forest);font-weight:900;font-size:1.1rem;line-height:1.2}.brand span small{display:block;font-size:.65rem;color:var(--green);letter-spacing:1px;text-transform:uppercase}
.nav-links,.navlinks{display:flex;align-items:center;gap:22px}.nav-links a,.navlinks a{color:#3f4c45;font-weight:700;font-size:.91rem;transition:.2s}.nav-links a:hover,.nav-links a.active,.navlinks a:hover{color:var(--green)}
.nav-cta,.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:12px 22px;font-weight:800;cursor:pointer;transition:.2s;text-align:center;}.nav-cta,.btn.primary{background:var(--green);color:#fff}.nav-cta:hover,.btn.primary:hover,.btn:hover{background:var(--forest);color:#fff;transform:translateY(-1px)}.btn.white{background:#fff;color:var(--forest)}.btn.outline{border:1px solid var(--green);color:var(--green);background:transparent}.btn.outline:hover{background:var(--green);color:#fff}.btn.dark{background:var(--forest);color:#fff}
.hamb,.menu-btn{display:none;background:#edf3ec;border:0;border-radius:10px;padding:10px;font-size:1.2rem;cursor:pointer}
.pagehero{background-color:#092a20;padding:100px 0;color:white;text-align:center;background-image:linear-gradient(100deg,rgba(9,42,32,.9),rgba(9,42,32,.7)),url('ella.jpg');background-size:cover;background-position:center}.pagehero h1{font-size:clamp(2.6rem,5vw,4rem);margin:15px 0}.pagehero p{font-size:1.1rem;max-width:600px;margin:0 auto;color:#eef5ef}.eyebrow{font-size:.78rem;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:var(--lime);margin-bottom:8px}
.section{padding:82px 0}.section.alt{background:var(--sand)}.section-head,.section-top{max-width:720px;margin:0 auto 36px;text-align:center}.section-top{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:40px;flex-wrap:wrap;text-align:left;margin-left:0;margin-right:0}.kicker{color:var(--green);text-transform:uppercase;letter-spacing:1.8px;font-size:.76rem;font-weight:900}.section h2{font-size:clamp(2rem,4vw,3.1rem);line-height:1.12;letter-spacing:-1px;margin:10px 0 13px;color:var(--forest)}.section-head p,.muted{color:var(--muted);margin:0}.muted{font-size:1.1rem;max-width:540px;margin:15px 0 0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{border-radius:20px;background:#fff;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}.card-media{position:relative}.card-media img{width:100%;height:220px;object-fit:cover}.pill{position:absolute;top:15px;left:15px;background:#fff;color:var(--forest);font-size:.75rem;font-weight:800;padding:5px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:1px}.card-body{padding:26px;display:flex;flex-direction:column;flex:1;}.meta{font-size:.85rem;color:var(--green);font-weight:800;display:flex;gap:15px;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:1.4rem;color:var(--forest)}.card p{color:var(--muted);margin:0 0 18px;font-size:.95rem}.itinerary{background:#edf4e9;padding:15px;border-radius:12px;font-size:.88rem;color:#405447;line-height:1.5}.card-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-top:auto;padding-top:20px;}.card-bottom strong{display:block;font-size:1.4rem;color:var(--forest)}.card-bottom small{font-size:.75rem;color:var(--muted)}.text-link{font-weight:800;color:var(--green);text-decoration:none}.text-link:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:40px}.pricebox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:35px;box-shadow:var(--shadow);display:flex;flex-direction:column}.pricebox .pill{position:static;display:inline-block;background:#edf4e9;margin-bottom:20px;color:var(--forest)}.price{font-size:3rem;font-weight:900;color:var(--forest);letter-spacing:-1px;line-height:1;margin-bottom:15px}.price small{font-size:.92rem;font-weight:700;letter-spacing:0;color:var(--muted)}.pricebox p{margin-bottom:25px}
.notice{background:#edf4e9;border-radius:12px;padding:20px;color:#405447;font-size:.9rem;margin-top:40px;border-left:4px solid var(--green)}.banner{background:var(--forest);border-radius:24px;padding:50px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}.banner h2{color:#fff;margin:0 0 10px}.banner p{margin:0;color:#d6e7db;font-size:1.1rem;max-width:500px}
.footer{background:#091b14;color:#a9c0b3;padding:60px 0 30px}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:50px}.footer-grid .brand,.footer-inner .logo{color:#fff;display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.1rem}.footer-grid .brand img,.footer-inner .logo img{height:45px;filter:brightness(0) invert(1)}.footer-grid p{font-size:.9rem;line-height:1.6;margin-top:20px}.footer h4{color:#fff;font-size:1.1rem;margin:0 0 20px}.footer-grid a{display:block;margin:10px 0;transition:.2s}.footer-grid a:hover{color:#fff}.footer-bottom,.footer-inner{border-top:1px solid rgba(255,255,255,.1);padding-top:25px;display:flex;justify-content:space-between;font-size:.85rem;flex-wrap:wrap;gap:15px;align-items:center;}
.footer-links{display:flex; gap:15px; flex-wrap:wrap; justify-content:center;}
.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:15px 25px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px rgba(37,211,102,.3);z-index:40;transition:.2s}.wa-float:hover{transform:translateY(-3px)}

@media(max-width:980px){
  .grid3,.grid2,.footer-grid{grid-template-columns:repeat(2,1fr)}
  .nav-links,.navlinks{gap:13px}
  .nav-links a,.navlinks a{font-size:.83rem}
}

@media(max-width:760px){
  .wrap{width:min(100% - 30px,1160px)}
  .nav-inner,.nav{min-height:68px}
  .hamb,.menu-btn{display:block}
  .nav-links,.navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:20px;flex-direction:column;border-bottom:1px solid var(--line);box-shadow:var(--shadow);align-items:stretch}
  .nav-links.show,.navlinks.open{display:flex}
  .nav-links a,.navlinks a{padding:12px 0;font-size:1rem;border-bottom:1px solid var(--line)}
  .nav-links a:last-child,.navlinks a:last-child{border-bottom:none}
  .nav-cta{display:none}
  .grid3,.grid2,.footer-grid{grid-template-columns:1fr}
  
  .brand img{width:45px; height:45px;}
  .brand{font-size:1rem;}
  
  .pagehero{padding:60px 0;}
  .pagehero h1{font-size:2.2rem;}
  .section{padding:55px 0}
  
  .banner{padding:35px 25px;flex-direction:column;text-align:center;gap:20px;}
  .banner .btn{width:100%}
  .pricebox{padding:25px}
  .card-bottom{flex-wrap:wrap; align-items:center;}
  
  .footer-inner{flex-direction:column; text-align:center;}
}
</style>
</head>
